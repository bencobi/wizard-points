<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16102B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wizard">
<title>Wizard Punkte</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316102B'/%3E%3Cpath d='M32 12 L46 44 H18 Z' fill='%23F2C14E'/%3E%3Ccircle cx='32' cy='26' r='3' fill='%2316102B'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#16102B;
    --surface:#221A3E;
    --surface-2:#2C2250;
    --line:#3B2F66;
    --text:#F2ECDF;
    --dim:#A79CC8;
    --gold:#F2C14E;
    --hit:#7FD1A0;
    --miss:#E8807B;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: ui-serif, Georgia, "Noto Serif", "Times New Roman", serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:16px; line-height:1.45;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
  }
  #app{max-width:560px; margin:0 auto; padding:14px 14px 96px}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
  input{font:inherit}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  /* ---- Kopfzeile ---- */
  .top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:6px 2px 16px}
  .brand{font-family:var(--serif); font-size:26px; letter-spacing:.01em}
  .brand .hat{color:var(--gold)}
  .roundmark{font-family:var(--serif); font-size:15px; color:var(--dim)}
  .roundmark b{color:var(--text); font-size:22px}

  /* ---- Phasenband ---- */
  .phase{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:11px 2px; margin-bottom:16px;
  }
  .phase h2{margin:0; font-size:16px; font-weight:600}
  .phase .tally{font-family:var(--serif); font-size:15px; color:var(--dim)}
  .phase .tally b{color:var(--gold); font-size:19px}
  .phase .tally.bad b{color:var(--miss)}

  .dealline{margin:-6px 2px 14px; color:var(--dim); font-size:13.5px; font-variant-numeric:tabular-nums}
  .badge{display:inline-block; margin-left:7px; padding:1px 6px; border-radius:5px;
    background:var(--surface-2); color:var(--gold); font-size:11.5px; font-weight:600; vertical-align:2px}

  /* ---- Spielerzeilen ---- */
  .row{
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px;
    background:var(--surface); border-radius:12px; padding:10px 12px; margin-bottom:9px;
  }
  .who{min-width:0}
  .who .name{font-weight:600; display:flex; align-items:baseline; min-width:0}
  .who .name .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .badge{flex:none}
  .who .sub{font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums}
  .who .sub .said{color:var(--gold)}
  .total{font-family:var(--serif); font-size:15px; color:var(--dim); font-variant-numeric:tabular-nums}
  .total b{display:block; font-size:27px; color:var(--text); line-height:1.05; text-align:right}

  .stepper{display:flex; align-items:center; gap:4px}
  .stepper button{
    width:44px; height:44px; border-radius:11px; background:var(--surface-2);
    font-size:22px; font-family:var(--serif); line-height:1; color:var(--text);
  }
  .stepper button:disabled{opacity:.3}
  .stepper button:active{background:var(--gold); color:var(--bg)}
  .stepper .val{
    min-width:46px; text-align:center; font-family:var(--serif); font-size:27px;
    font-variant-numeric:tabular-nums;
  }
  .stepper .val.set{color:var(--gold)}

  /* ---- Aktionsknopf ---- */
  .cta{
    display:block; width:100%; margin-top:16px; padding:15px;
    background:var(--gold); color:#241645; border-radius:12px;
    font-weight:700; font-size:17px;
  }
  .cta.ghost{background:none; color:var(--dim); border:1px solid var(--line); font-weight:500; font-size:15px; padding:12px}
  .cta:disabled{opacity:.45}
  .note{text-align:center; color:var(--dim); font-size:13.5px; margin-top:10px; min-height:19px}
  .note.warn{color:var(--miss)}

  /* ---- Tabelle ---- */
  .scroller{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:12px; background:var(--surface)}
  table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
  th,td{padding:7px 9px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line)}
  thead th{font-size:13px; font-weight:600; color:var(--dim); position:sticky; top:0; background:var(--surface)}
  th.rnd,td.rnd{text-align:left; position:sticky; left:0; background:var(--surface); color:var(--dim); font-size:13px; width:1px}
  tbody td{font-family:var(--serif); font-size:19px}
  tbody td .bid{display:block; font-family:var(--sans); font-size:11.5px; line-height:1.3}
  .bid.hit{color:var(--hit)} .bid.miss{color:var(--miss)}
  tfoot td, tfoot th{border-bottom:none; background:var(--surface-2); font-family:var(--serif); font-size:21px}
  tfoot th.rnd{background:var(--surface-2)}
  .lead{color:var(--gold)}

  /* ---- Podest ---- */
  .final{text-align:center; padding:10px 0 4px}
  .final h2{font-family:var(--serif); font-size:24px; margin:0 0 4px}
  .final p{color:var(--dim); margin:0 0 18px; font-size:14px}
  .rank{display:flex; align-items:baseline; gap:12px; padding:12px 14px; background:var(--surface); border-radius:12px; margin-bottom:8px}
  .rank .pos{font-family:var(--serif); font-size:20px; color:var(--gold); width:24px}
  .rank .nm{flex:1; text-align:left; font-weight:600}
  .rank .pt{font-family:var(--serif); font-size:24px}

  /* ---- Einrichtung ---- */
  .lead-in{color:var(--dim); font-size:14.5px; margin:0 0 18px}
  .pinput{display:flex; align-items:center; gap:10px; margin-bottom:8px; background:var(--surface); border-radius:12px; padding:4px 6px 4px 14px}
  .pinput span{font-family:var(--serif); color:var(--gold); width:16px}
  .pinput input{flex:1; background:none; border:none; color:var(--text); padding:12px 0; min-width:0}
  .pinput input::placeholder{color:#6E639099}
  .pinput .rm{width:40px; height:40px; border-radius:10px; color:var(--dim); font-size:20px}
  .rules{margin-top:22px; padding-top:14px; border-top:1px solid var(--line); color:var(--dim); font-size:13.5px}
  .rules b{color:var(--text); font-weight:600}

  /* ---- Umschalter unten ---- */
  .tabs{
    position:fixed; left:0; right:0; bottom:0; display:flex; gap:6px;
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 72%, transparent);
  }
  .tabs .inner{display:flex; gap:6px; width:100%; max-width:560px; margin:0 auto; background:var(--surface); border-radius:12px; padding:4px}
  .tabs button{flex:1; padding:11px; border-radius:9px; font-size:15px; color:var(--dim)}
  .tabs button[aria-current="true"]{background:var(--surface-2); color:var(--text); font-weight:600}
  @media (prefers-reduced-motion:no-preference){
    .row{transition:background .18s ease}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------- Speicher: Artefakt-Storage, sonst Browser, sonst nur Sitzung ---------- */
var KEY = "wizard:state";
var store = (function(){
  if (window.storage && typeof window.storage.get === "function") {
    return {
      get: function(){ return window.storage.get(KEY).then(function(r){ return r ? r.value : null; }).catch(function(){ return null; }); },
      set: function(v){ try { window.storage.set(KEY, v); } catch(e){} }
    };
  }
  var ls = null;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ls = localStorage; } catch(e){}
  var mem = null;
  return {
    get: function(){ return Promise.resolve(ls ? ls.getItem(KEY) : mem); },
    set: function(v){ if (ls) { try { ls.setItem(KEY, v); } catch(e){} } else { mem = v; } }
  };
})();

/* ---------- Zustand ---------- */
var S = null;
function fresh(){ return { names:[], rounds:[], draft:null, view:"round" }; }
function totalRounds(){ return Math.floor(60 / S.names.length); }
function roundNo(){ return S.rounds.length + 1; }
function points(bid, tricks){ return bid === tricks ? 20 + 10*tricks : -10*Math.abs(bid-tricks); }
function totals(){
  return S.names.map(function(_, i){
    return S.rounds.reduce(function(sum, r){ return sum + points(r.bids[i], r.tricks[i]); }, 0);
  });
}
function sum(a){ return a.reduce(function(x,y){ return x+y; }, 0); }
function save(){ store.set(JSON.stringify(S)); }

/* ---------- Hilfen ---------- */
var app = document.getElementById("app");
function el(html){ var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function signed(n){ return (n > 0 ? "+" : "") + n; }

function stepper(value, max, isSet, onChange){
  var node = el(
    '<div class="stepper">' +
      '<button type="button" aria-label="weniger">\u2212</button>' +
      '<span class="val' + (isSet ? " set" : "") + '">' + value + '</span>' +
      '<button type="button" aria-label="mehr">+</button>' +
    '</div>');
  var minus = node.children[0], out = node.children[1], plus = node.children[2];
  minus.disabled = value <= 0;
  plus.disabled = value >= max;
  minus.onclick = function(){ onChange(value - 1); };
  plus.onclick = function(){ onChange(value + 1); };
  return node;
}

/* ---------- Bildschirm: Einrichtung ---------- */
function viewSetup(){
  app.innerHTML = "";
  app.appendChild(el(
    '<div class="top"><div class="brand"><span class="hat">\u25B2</span> Wizard</div></div>'));
  app.appendChild(el('<p class="lead-in">Namen eintragen, dann geht es los. Drei bis sechs Spieler.</p>'));

  var names = S.names.length ? S.names.slice() : ["", "", ""];
  var list = el('<div></div>');
  app.appendChild(list);

  var startBtn = el('<button class="cta" type="button">Spiel starten</button>');
  var hint = el('<p class="note"></p>');
  var addBtn = el('<button class="cta ghost" type="button">Spieler hinzuf\u00fcgen</button>');

  function paint(){
    list.innerHTML = "";
    names.forEach(function(n, i){
      var row = el(
        '<div class="pinput"><span>' + (i+1) + '</span>' +
        '<input type="text" inputmode="text" autocomplete="off" placeholder="Spieler ' + (i+1) + '" value="' + esc(n) + '">' +
        (names.length > 3 ? '<button class="rm" type="button" aria-label="entfernen">\u00d7</button>' : '') +
        '</div>');
      var input = row.querySelector("input");
      input.oninput = function(){ names[i] = input.value; };
      var rm = row.querySelector(".rm");
      if (rm) rm.onclick = function(){ names.splice(i,1); paint(); };
      list.appendChild(row);
    });
    addBtn.disabled = names.length >= 6;
    hint.textContent = names.length + " Spieler \u00b7 " + Math.floor(60/names.length) + " Runden";
  }
  addBtn.onclick = function(){ if (names.length < 6) { names.push(""); paint(); } };

  startBtn.onclick = function(){
    S.names = names.map(function(n, i){ return n.trim() || ("Spieler " + (i+1)); });
    S.rounds = [];
    S.draft = null;
    save();
    render();
  };

  app.appendChild(addBtn);
  app.appendChild(startBtn);
  app.appendChild(hint);
  app.appendChild(el(
    '<div class="rules"><b>Punkte</b> \u00b7 Ansage getroffen: 20 Punkte plus 10 je Stich. ' +
    'Daneben: 10 Punkte Abzug je Stich Differenz.</div>'));
  paint();
}

/* ---------- Bildschirm: Runde ---------- */
function viewRound(){
  var n = roundNo(), max = n, tot = totals();
  if (!S.draft) S.draft = { phase:"bid", bids:S.names.map(function(){ return 0; }), tricks:S.names.map(function(){ return 0; }) };
  var d = S.draft;
  var bidding = d.phase === "bid";
  var vals = bidding ? d.bids : d.tricks;
  var have = sum(vals);

  app.innerHTML = "";
  app.appendChild(el(
    '<div class="top"><div class="brand"><span class="hat">\u25B2</span> Wizard</div>' +
    '<div class="roundmark"><b>' + n + '</b> / ' + totalRounds() + '</div></div>'));

  var offBy = have !== max;
  app.appendChild(el(
    '<div class="phase"><h2>' + (bidding ? "Ansagen" : "Stiche eintragen") + '</h2>' +
    '<div class="tally' + (!bidding && offBy ? " bad" : "") + '">' +
    (bidding ? 'angesagt <b>' + have + '</b> von ' + max
             : 'verteilt <b>' + have + '</b> von ' + max) + '</div></div>'));

  var count = S.names.length;
  var dealer = (n - 1) % count;
  app.appendChild(el('<p class="dealline">' + esc(S.names[dealer]) + ' gibt \u00b7 ' +
    n + (n === 1 ? ' Karte' : ' Karten') + ' je Spieler \u00b7 ' +
    (60 - n*count) + ' bleiben liegen</p>'));

  var order = [];
  for (var k = 0; k < count; k++) order.push((dealer + 1 + k) % count);

  order.forEach(function(i, seat){
    var badge = i === dealer ? '<span class="badge">gibt</span>'
              : (seat === 0 ? '<span class="badge">beginnt</span>' : '');
    var row = el('<div class="row"><div class="who"><div class="name"><span class="nm">' +
      esc(S.names[i]) + '</span>' + badge + '</div></div></div>');
    var who = row.querySelector(".who");
    if (bidding) {
      who.appendChild(el('<div class="sub">' + tot[i] + ' Punkte</div>'));
    } else {
      who.appendChild(el('<div class="sub">sagt <span class="said">' + d.bids[i] + '</span> \u00b7 ' +
        signed(points(d.bids[i], d.tricks[i])) + ' Punkte</div>'));
    }
    row.appendChild(stepper(vals[i], max, vals[i] > 0, function(v){
      vals[i] = v; save(); render();
    }));
    app.appendChild(row);
  });

  var note = el('<p class="note"></p>');
  if (bidding) {
    var cta = el('<button class="cta" type="button">Weiter zu den Stichen</button>');
    cta.onclick = function(){ d.phase = "tricks"; d.tricks = S.names.map(function(){ return 0; }); save(); render(); };
    app.appendChild(cta);
    note.textContent = have === max
      ? "Summe passt genau \u2013 in der Vorhand-Variante darf " + S.names[dealer] + " das nicht ansagen."
      : "Reihenfolge von oben nach unten, " + S.names[dealer] + " sagt zuletzt an.";
  } else {
    var done = el('<button class="cta" type="button">Runde eintragen</button>');
    done.disabled = offBy;
    done.onclick = function(){
      S.rounds.push({ bids:d.bids.slice(), tricks:d.tricks.slice() });
      S.draft = null; save(); render();
    };
    app.appendChild(done);
    var back = el('<button class="cta ghost" type="button">Zur\u00fcck zu den Ansagen</button>');
    back.onclick = function(){ d.phase = "bid"; save(); render(); };
    app.appendChild(back);
    if (offBy) {
      note.className = "note warn";
      note.textContent = have < max
        ? "Es fehlen noch " + (max - have) + " Stiche."
        : (have - max) + " Stiche zu viel.";
    }
  }
  app.appendChild(note);
  app.appendChild(tabs());
}

/* ---------- Bildschirm: Tabelle ---------- */
function viewTable(){
  var tot = totals(), best = Math.max.apply(null, tot);
  app.innerHTML = "";
  app.appendChild(el(
    '<div class="top"><div class="brand"><span class="hat">\u25B2</span> Wizard</div>' +
    '<div class="roundmark">' + S.rounds.length + ' von ' + totalRounds() + ' gespielt</div></div>'));

  if (!S.rounds.length) {
    app.appendChild(el('<p class="lead-in">Noch keine Runde eingetragen. Die Tabelle f\u00fcllt sich, sobald die erste Runde steht.</p>'));
    app.appendChild(tabs());
    return;
  }

  var head = '<tr><th class="rnd">Rd</th>' + S.names.map(function(nm){
    return '<th>' + esc(nm.length > 8 ? nm.slice(0,8) + "\u2026" : nm) + '</th>'; }).join("") + '</tr>';

  var run = S.names.map(function(){ return 0; });
  var body = S.rounds.map(function(r, ri){
    var cells = S.names.map(function(_, i){
      var p = points(r.bids[i], r.tricks[i]);
      run[i] += p;
      return '<td><span class="bid ' + (p > 0 ? "hit" : "miss") + '">' + r.bids[i] + "/" + r.tricks[i] +
             '</span>' + run[i] + '</td>';
    }).join("");
    return '<tr><td class="rnd">' + (ri+1) + '</td>' + cells + '</tr>';
  }).join("");

  var foot = '<tr><th class="rnd">Stand</th>' + tot.map(function(t){
    return '<td' + (t === best ? ' class="lead"' : '') + '>' + t + '</td>'; }).join("") + '</tr>';

  app.appendChild(el('<div class="scroller"><table><thead>' + head + '</thead><tbody>' + body +
                     '</tbody><tfoot>' + foot + '</tfoot></table></div>'));

  var undo = el('<button class="cta ghost" type="button">Letzte Runde l\u00f6schen</button>');
  undo.onclick = function(){ if (confirm("Runde " + S.rounds.length + " l\u00f6schen?")) { S.rounds.pop(); S.draft = null; save(); render(); } };
  app.appendChild(undo);
  app.appendChild(tabs());
}

/* ---------- Bildschirm: Schluss ---------- */
function viewFinal(){
  var tot = totals();
  var order = S.names.map(function(nm, i){ return { nm:nm, pt:tot[i] }; })
                     .sort(function(a,b){ return b.pt - a.pt; });
  app.innerHTML = "";
  app.appendChild(el('<div class="top"><div class="brand"><span class="hat">\u25B2</span> Wizard</div></div>'));
  app.appendChild(el('<div class="final"><h2>' + esc(order[0].nm) + ' gewinnt</h2>' +
                     '<p>Nach ' + totalRounds() + ' Runden</p></div>'));
  order.forEach(function(p, i){
    app.appendChild(el('<div class="rank"><span class="pos">' + (i+1) + '</span>' +
                       '<span class="nm">' + esc(p.nm) + '</span><span class="pt">' + p.pt + '</span></div>'));
  });
  var again = el('<button class="cta" type="button">Neues Spiel, gleiche Runde</button>');
  again.onclick = function(){ S.rounds = []; S.draft = null; save(); render(); };
  app.appendChild(again);
  var reset = el('<button class="cta ghost" type="button">Spieler \u00e4ndern</button>');
  reset.onclick = function(){ S = fresh(); save(); render(); };
  app.appendChild(reset);
  app.appendChild(tabs());
}

/* ---------- Umschalter ---------- */
function tabs(){
  var over = S.rounds.length >= totalRounds();
  var node = el('<nav class="tabs"><div class="inner">' +
    '<button type="button">' + (over ? "Ergebnis" : "Runde") + '</button>' +
    '<button type="button">Tabelle</button></div></nav>');
  var a = node.querySelectorAll("button")[0], b = node.querySelectorAll("button")[1];
  a.setAttribute("aria-current", S.view === "round" ? "true" : "false");
  b.setAttribute("aria-current", S.view === "table" ? "true" : "false");
  a.onclick = function(){ S.view = "round"; save(); render(); };
  b.onclick = function(){ S.view = "table"; save(); render(); };
  return node;
}

/* ---------- Start ---------- */
function render(){
  if (!S.names.length) return viewSetup();
  if (S.view === "table") return viewTable();
  if (S.rounds.length >= totalRounds()) return viewFinal();
  viewRound();
}

Promise.resolve(store.get()).then(function(raw){
  try { S = raw ? JSON.parse(raw) : fresh(); } catch(e){ S = fresh(); }
  if (!S || !Array.isArray(S.names)) S = fresh();
  render();
});
})();
</script>
</body>
</html>
