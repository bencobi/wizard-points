<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spielblock">
<meta name="description" content="Punkteblock für Wizard und Kniffel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Spielblock</title>
<style>
  :root{
    --bg-0:#FFF7F7;
    --bg-1:#FBE3E5;
    --glow:rgba(213,243,216,.9);
    --panel:#FFFFFF;
    --head:#FFF1F3;
    --foot:#FBDFE4;
    --gold:#FF8DA6;
    --gold-2:#E8637F;
    --tint:rgba(255,141,166,.18);
    --text:#2B1F23;
    --dim:#8B7076;
    --glass:rgba(43,31,35,.035);
    --glass-2:rgba(43,31,35,.075);
    --hair:rgba(43,31,35,.14);
    --hit:#1F9A63;
    --miss:#D6414F;
    --well:rgba(43,31,35,.055);
    --on-gold:#FFFFFF;
    --ui: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --r:14px;
  }
  [data-theme="dark"]{
    --bg-0:#121212; --bg-1:#262626; --glow:rgba(77,255,188,.18);
    --panel:#242424; --head:#1C1C1C; --foot:#2B2B2B;
    --gold:#4DFFBC; --gold-2:#25C98E; --tint:rgba(77,255,188,.14);
    --text:#F2F2F2; --dim:#9A9A9A;
    --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.12); --hair:rgba(255,255,255,.11);
    --well:rgba(0,0,0,.3); --on-gold:#0B2019;
    --hit:#4DFFBC; --miss:#FF4D4D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{touch-action:manipulation}
  html,body{margin:0; min-height:100%}
  body{
    background:
      radial-gradient(125% 58% at 50% -10%, var(--glow) 0%, transparent 64%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 52%);
    background-color:var(--bg-0);
    background-attachment:fixed;
    color:var(--text); font-family:var(--ui); font-size:16px; line-height:1.45;
    letter-spacing:-.01em;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
  }
  #app{max-width:560px; margin:0 auto; padding:12px 14px 104px}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;
    touch-action:manipulation; user-select:none; -webkit-user-select:none}
  input{font:inherit}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}

  /* Kopf */
  .top{display:flex; align-items:center; gap:12px; padding:4px 2px 14px}
  .brand{font-size:19px; font-weight:700; letter-spacing:-.02em; margin-right:auto; display:flex; align-items:center; gap:8px}
  .brand .hat{
    width:22px; height:22px; border-radius:7px; display:grid; place-items:center; font-size:11px;
    color:var(--on-gold); background:linear-gradient(160deg, var(--gold), var(--gold-2));
    box-shadow:0 3px 12px rgba(0,0,0,.35);
  }
  .menubtn{width:36px; height:36px; border-radius:12px; background:var(--glass);
    border:1px solid var(--hair); color:var(--dim); font-size:17px; line-height:1; flex:none}

  /* Rundenband */
  .strip{display:flex; align-items:flex-end; gap:3px; height:46px; margin:0 2px 14px}
  .strip i{flex:1; border-radius:3px 3px 2px 2px; background:var(--glass-2)}
  .strip i.done{background:var(--dim); opacity:.55}
  .strip i.now{background:linear-gradient(180deg, var(--gold), var(--gold-2));
    box-shadow:0 0 16px var(--tint)}
  .headline{margin:0 2px 3px; font-size:27px; font-weight:800; letter-spacing:-.03em}
  .headline em{font-style:normal; color:var(--dim); font-weight:600; font-size:16px; letter-spacing:-.01em}
  .meta{margin:0 2px 18px; color:var(--dim); font-size:14px}

  /* Abschnittszeile */
  .phase{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 2px 10px}
  .phase h2{margin:0; font-size:16px; font-weight:700; letter-spacing:-.01em}
  .phase .tally{font-size:14px; color:var(--dim)}
  .phase .tally b{color:var(--text); font-weight:700}
  .phase .tally.bad b{color:var(--miss)}

  /* Spielerzeilen */
  .row{position:relative; display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px;
    background:var(--glass); border:1px solid var(--hair); border-radius:var(--r);
    padding:11px 12px 11px 15px; margin-bottom:8px; overflow:hidden}
  .row::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--acc, var(--dim))}
  .row.leader{background:linear-gradient(90deg, var(--tint), var(--glass) 62%)}
  .who{min-width:0}
  .who .name{display:flex; align-items:baseline; min-width:0; font-size:16.5px; font-weight:650}
  .who .name .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .who .sub{font-size:13px; color:var(--dim); display:flex; align-items:center; gap:6px}
  .who .sub .said{color:var(--gold); font-weight:700}
  .badge{flex:none; margin-left:8px; padding:2px 7px; border-radius:7px; font-size:11px; font-weight:700;
    background:var(--glass-2); color:var(--gold)}
  .chip{flex:none; padding:1px 6px; border-radius:6px; font-size:11.5px; font-weight:700;
    background:var(--glass-2); color:var(--hit)}
  .chip.down{color:var(--miss)}
  @supports (background:color-mix(in srgb, red 10%, transparent)){
    .chip{background:color-mix(in srgb, var(--hit) 17%, transparent)}
    .chip.down{background:color-mix(in srgb, var(--miss) 17%, transparent)}
  }

  /* Zähler */
  .stepper{display:flex; align-items:center; gap:2px; background:var(--well);
    border:1px solid var(--hair); border-radius:13px; padding:3px}
  .stepper button{width:42px; height:40px; border-radius:10px; font-size:20px; font-weight:600; color:var(--dim)}
  .stepper button:disabled{opacity:.28}
  .stepper button:active:not(:disabled), .stepper button.tap:not(:disabled){background:var(--glass-2); color:var(--text)}
  .stepper .val{min-width:34px; text-align:center; font-size:22px; font-weight:800}
  .stepper .val.set{color:var(--gold)}

  /* Knöpfe */
  .cta{display:block; width:100%; margin-top:14px; padding:16px; border-radius:15px;
    background:linear-gradient(165deg, var(--gold), var(--gold-2)); color:var(--on-gold);
    font-weight:800; font-size:17px; letter-spacing:-.01em;
    box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .cta:active{transform:translateY(1px)}
  .cta.ghost{background:none; box-shadow:none; color:var(--dim); border:1px solid var(--hair);
    font-weight:600; font-size:15px; padding:13px}
  .cta:disabled{opacity:.4; box-shadow:none}
  .note{text-align:center; color:var(--dim); font-size:13.5px; margin-top:11px; min-height:19px}
  .note.warn{color:var(--miss)}

  /* Tabelle */
  .scroller{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--r);
    background:var(--glass); border:1px solid var(--hair)}
  table{border-collapse:collapse; width:100%}
  th,td{padding:8px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--hair)}
  thead th{font-size:13px; font-weight:700; color:var(--text); position:sticky; top:0;
    background:var(--head); border-bottom:1px solid var(--hair)}
  thead th i{display:inline-block; width:7px; height:7px; border-radius:9px; margin-right:5px; background:var(--acc)}
  th.rnd,td.rnd{text-align:left; position:sticky; left:0; background:var(--head); color:var(--dim); font-size:13px; width:1px}
  tbody td{font-size:17px; font-weight:650; font-variant-numeric:tabular-nums}
  tbody td .bid{display:block; font-size:11.5px; font-weight:600; line-height:1.35}
  td.rnd .cards{display:block; font-size:11px; color:#6F639A}
  .bid.hit{color:var(--hit)} .bid.miss{color:var(--miss)}
  tfoot td, tfoot th{border-bottom:none; background:var(--foot); font-size:19px; font-weight:800}
  tfoot th.rnd{background:var(--foot); color:var(--dim); font-size:13px}
  .lead{color:var(--gold)}

  /* Ergebnis */
  .final{padding:6px 2px 16px}
  .final h2{font-size:30px; font-weight:800; letter-spacing:-.03em; margin:0 0 2px}
  .final p{color:var(--dim); margin:0; font-size:14px}
  .rank{display:flex; align-items:center; gap:12px; padding:14px 15px; background:var(--glass);
    border:1px solid var(--hair); border-radius:var(--r); margin-bottom:8px; position:relative; overflow:hidden}
  .rank::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--acc)}
  .rank.first{background:linear-gradient(90deg, var(--tint), var(--glass) 65%)}
  .rank.tap{width:100%; text-align:left; font:inherit}
  .rank.tap:active{background:var(--glass-2)}
  .rank .pos{font-size:15px; font-weight:800; color:var(--dim); width:18px}
  .rank .nm{flex:1; min-width:0; font-weight:700; overflow:hidden}
  .rank .nm .sub{display:block; font-size:12px; font-weight:600; color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rank .pt{font-size:23px; font-weight:800; font-variant-numeric:tabular-nums}

  /* Start */
  .lead-in{color:var(--dim); font-size:14.5px; margin:0 2px 16px}
  .pinput{display:flex; align-items:center; gap:10px; margin-bottom:8px; background:var(--glass);
    border:1px solid var(--hair); border-radius:var(--r); padding:3px 6px 3px 14px}
  .pinput i{width:9px; height:9px; border-radius:9px; background:var(--acc); flex:none}
  .pinput input{flex:1; background:none; border:none; color:var(--text); padding:13px 0; min-width:0; font-weight:600}
  .pinput input::placeholder{color:#6C6096; font-weight:500}
  .pinput .rm{width:38px; height:38px; border-radius:11px; color:var(--dim); font-size:19px}
  .modes{display:flex; gap:8px; margin:2px 0 16px}
  .modes button{flex:1; text-align:left; padding:12px 13px; border-radius:var(--r);
    background:var(--glass); border:1px solid var(--hair)}
  .modes button[aria-current="true"]{border-color:var(--gold); background:var(--tint)}
  .modes button b{display:block; font-size:15px; font-weight:700}
  .modes button span{display:block; margin-top:2px; font-size:12px; color:var(--dim); line-height:1.35}
  .toggle{display:flex; align-items:center; gap:12px; margin-bottom:8px; padding:12px 14px;
    background:var(--glass); border:1px solid var(--hair); border-radius:var(--r); width:100%; text-align:left}
  .toggle .box{width:24px; height:24px; border-radius:8px; border:1.5px solid var(--hair); flex:none;
    display:grid; place-items:center; font-size:14px; color:var(--on-gold)}
  .toggle[aria-pressed="true"] .box{background:linear-gradient(160deg, var(--gold), var(--gold-2)); border-color:transparent}
  .toggle b{display:block; font-size:15px; font-weight:700}
  .toggle span{display:block; font-size:12.5px; color:var(--dim); line-height:1.35; margin-top:1px}
  .swatches{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 16px}
  .swatches button{flex:1 1 calc(50% - 4px); height:56px; border-radius:12px;
    border:1px solid var(--hair); display:grid; place-items:end center; padding-bottom:6px;
    font-size:11.5px; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .swatches button[data-t="light"]{text-shadow:none}
  .swatches button[aria-current="true"]{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset}
  .rules{margin-top:20px; padding-top:14px; border-top:1px solid var(--hair); color:var(--dim); font-size:13.5px}
  .rules b{color:var(--text); font-weight:700}

  /* Menü */
  .sheet{position:fixed; inset:0; z-index:20; background:rgba(8,5,18,.6);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    display:flex; align-items:flex-end; justify-content:center}
  .sheet .panel{width:100%; max-width:560px; margin:12px; padding:6px;
    background:var(--panel); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border:1px solid var(--hair); border-radius:20px;
    margin-bottom:calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .sheet .panel button{display:block; width:100%; text-align:left; padding:15px; border-radius:14px;
    font-size:16px; font-weight:600}
  .sheet .panel button:active{background:var(--glass)}
  .sheet .panel > button + button{border-top:1px solid var(--hair)}
  .sheet .panel > button:last-child{border-top:1px solid var(--hair); color:var(--dim); text-align:center}
  .sheet .panel button.danger{color:var(--miss)}
  @media (prefers-reduced-motion:no-preference){
    .sheet .panel{animation:rise .22s cubic-bezier(.2,.8,.3,1)}
    .strip i{transition:background .25s ease}
  }
  @keyframes rise{from{transform:translateY(14px); opacity:0} to{transform:none; opacity:1}}

  /* Anleitung */
  .sheet .panel.scrollable{display:flex; flex-direction:column; max-height:84vh}
  .sheet .head{padding:15px 16px 8px; font-size:16px; font-weight:800; letter-spacing:-.02em}
  .sheet .rules-body{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    touch-action:pan-y; -webkit-overflow-scrolling:touch; padding:0 16px 6px}
  .sheet .rules-body section{padding:11px 0; border-top:1px solid var(--hair)}
  .sheet .rules-body section:first-child{border-top:none; padding-top:2px}
  .sheet .rules-body h3{margin:0 0 3px; font-size:14.5px; font-weight:700}
  .sheet .rules-body p{margin:0; font-size:14px; color:var(--dim); line-height:1.5}

  /* Auswertung */
  .stats{margin-top:18px; background:var(--glass); border:1px solid var(--hair); border-radius:var(--r); overflow:hidden}
  .stats h3{margin:0; padding:12px 15px 0; font-size:13px; font-weight:700; color:var(--dim)}
  .stats div{padding:11px 15px; border-top:1px solid var(--hair)}
  .stats div:first-of-type{border-top:none}
  .stats span{display:block; font-size:12.5px; color:var(--dim); margin-bottom:1px}
  .stats b{display:block; font-size:15.5px; font-weight:700; line-height:1.35}
  .stats b em{font-style:normal; color:var(--dim); font-weight:600}

  /* Spielauswahl */
  .games{display:flex; gap:8px; margin:2px 0 18px}
  .games button{flex:1; padding:14px 13px; border-radius:var(--r); background:var(--glass);
    border:1px solid var(--hair); text-align:left}
  .games button[aria-current="true"]{border-color:var(--gold); background:var(--tint)}
  .games button b{display:block; font-size:16px; font-weight:800}
  .games button span{display:block; margin-top:2px; font-size:12px; color:var(--dim); line-height:1.35}

  /* Spielerwechsel im Block */
  .players{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 0 14px; padding-bottom:2px}
  .players button{flex:none; display:flex; align-items:center; gap:7px; padding:9px 13px; border-radius:12px;
    background:var(--glass); border:1px solid var(--hair); font-size:14px; font-weight:600; color:var(--dim)}
  .players button i{width:8px; height:8px; border-radius:9px; background:var(--acc)}
  .players button[aria-current="true"]{color:var(--text); border-color:var(--gold); background:var(--tint)}

  /* Kniffel-Block */
  .group{margin:18px 2px 7px; font-size:13px; font-weight:700; color:var(--dim)}
  .line{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:12px 14px; margin-bottom:6px; text-align:left; border-radius:12px;
    background:var(--glass); border:1px solid var(--hair); font-size:15.5px; font-weight:600}
  .line .v{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums}
  .line .v.empty{color:var(--dim); font-weight:600}
  .line:active{background:var(--glass-2)}
  .line.calc{background:none; border-color:transparent; padding:7px 14px; margin-bottom:2px;
    font-weight:600; color:var(--dim)}
  .line.calc .v{font-size:16px; color:var(--text)}
  .line.sum{background:var(--tint); border-color:transparent; font-weight:800}
  .line.sum .v{font-size:21px}
  .hintline{margin:2px 2px 10px; font-size:13px; color:var(--dim)}

  /* Werteliste */
  .sheet .panel .numgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; padding:8px}
  .sheet .panel .numgrid button{padding:0; height:50px; border-radius:12px; text-align:center;
    font-size:18px; font-weight:800; background:var(--glass); border:1px solid var(--hair)}
  .sheet .panel .numgrid button[aria-current="true"]{background:linear-gradient(160deg, var(--gold), var(--gold-2));
    color:var(--on-gold); border-color:transparent}
  .sheet .panel .numgrid button.wide{grid-column:span 5; height:46px; font-size:15px; font-weight:700}

  /* Phase 10 */
  .games{flex-direction:column}
  .games button{display:flex; align-items:center; gap:12px}
  .games button b{font-size:16px}
  .games button .txt{min-width:0}
  .check{width:46px; height:46px; flex:none; border-radius:13px; background:var(--well);
    border:1px solid var(--hair); font-size:19px; color:var(--dim)}
  .check[aria-pressed="true"]{background:linear-gradient(160deg, var(--gold), var(--gold-2));
    color:var(--on-gold); border-color:transparent}
  .pill{min-width:62px; height:46px; padding:0 12px; border-radius:13px; background:var(--well);
    border:1px solid var(--hair); font-size:19px; font-weight:800; font-variant-numeric:tabular-nums}
  .pill.zero{color:var(--dim); font-weight:600}
  .acts{display:flex; gap:6px; align-items:center}
  .who .sub.wrap{white-space:normal; line-height:1.3}
  .counter{padding:4px 8px 8px}
  .counter .crow{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 8px; border-top:1px solid var(--hair)}
  .counter .crow:first-child{border-top:none}
  .counter .crow b{font-size:15px; font-weight:600}
  .counter .crow span{display:block; font-size:12px; color:var(--dim)}
  .counter .total{display:flex; justify-content:space-between; padding:12px 8px 4px;
    font-size:17px; font-weight:800}

  /* Ziffernfeld */
  .keyval{padding:8px 16px 2px; font-size:36px; font-weight:800; text-align:center;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .keyval.empty{color:var(--dim)}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:8px}
  .keypad button{padding:0; height:56px; border-radius:13px; text-align:center; font-size:21px;
    font-weight:700; background:var(--glass); border:1px solid var(--hair)}
  .keypad button.wide{grid-column:span 3; background:linear-gradient(160deg, var(--gold), var(--gold-2));
    color:var(--on-gold); border-color:transparent; font-weight:800}

  /* Hauptmen\u00fc */
  .tile{display:flex; gap:8px; margin-bottom:8px}
  .tilemain{flex:1; min-width:0; text-align:left; padding:15px 16px; border-radius:var(--r);
    background:var(--glass); border:1px solid var(--hair)}
  .tilemain b{display:block; font-size:17px; font-weight:800; letter-spacing:-.02em}
  .tilemain span{display:block; margin-top:2px; font-size:12.5px; color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tilemain .live-txt{margin-top:5px; font-size:13px; font-weight:700; color:var(--gold)}
  .tile.live .tilemain{border-color:var(--gold); background:var(--tint)}
  .tilenew{flex:none; width:58px; border-radius:var(--r); background:var(--glass);
    border:1px solid var(--hair); font-size:13px; font-weight:700; color:var(--dim)}

  .sub2{display:block; font-size:12px; font-weight:600; color:var(--dim)}
  .form{display:inline-flex; gap:3px; vertical-align:1px; margin-right:6px}
  .form i{width:9px; height:9px; border-radius:9px; background:var(--glass-2)}
  .form i.win{background:linear-gradient(160deg, var(--gold), var(--gold-2))}
  .form i.loss{background:var(--glass-2); border:1px solid var(--hair)}
  .line .v.gut{color:var(--hit)}
  .line .v.schlecht{color:var(--miss)}

  .livechip{flex:none; height:36px; padding:0 11px; border-radius:12px; background:var(--glass);
    border:1px solid var(--hair); color:var(--dim); font-size:13px; font-weight:700}
  .livechip.an{border-color:var(--gold); color:var(--gold); background:var(--tint)}

  .codeeingabe{padding:4px 16px 8px}
  .codeeingabe input{width:100%; padding:14px; border-radius:13px; background:var(--well);
    border:1px solid var(--hair); color:var(--text); font-size:22px; font-weight:800;
    letter-spacing:.12em; text-align:center}
  .scanbox{padding:8px 16px}
  .scanbox video{width:100%; border-radius:14px; background:#000; aspect-ratio:1/1; object-fit:cover}

  .countdown .zahl.puls{animation:zaehlen .5s cubic-bezier(.2,.9,.3,1)}
  @keyframes zaehlen{0%{transform:scale(1.45); opacity:.15}45%{transform:scale(1); opacity:1}100%{transform:none}}
  @media (prefers-reduced-motion:reduce){ .countdown .zahl.puls{animation:none} }

  .radbox{position:relative; width:min(78vw,300px); margin:6px auto 18px; aspect-ratio:1/1}
  .rad{width:100%; height:100%; display:block; transform-origin:50% 50%;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.28))}
  .rad .feld{fill:var(--glass-2); stroke:var(--hair); stroke-width:.4}
  .rad .feld.zwei{fill:var(--tint)}
  .rad text{font-size:9px; font-weight:800; fill:var(--text); text-anchor:middle; dominant-baseline:middle}
  .rad .nabe{fill:var(--gold)}
  .zeiger{position:absolute; left:50%; top:-6px; width:0; height:0; transform:translateX(-50%); z-index:2;
    border-left:11px solid transparent; border-right:11px solid transparent; border-top:20px solid var(--gold)}
  .radergebnis{letter-spacing:.1em}
  @media (prefers-reduced-motion:reduce){ .rad{transition:none !important} }

  /* Umschalter */
  .update{position:fixed; left:12px; right:12px; bottom:calc(74px + env(safe-area-inset-bottom));
    z-index:30; display:flex; align-items:center; gap:10px; padding:11px 12px 11px 15px;
    background:var(--panel); border:1px solid var(--gold); border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.3); font-size:14px; font-weight:600}
  .update span{flex:1; min-width:0}
  .update button{flex:none; padding:9px 14px; border-radius:10px; font-weight:800; font-size:14px;
    background:linear-gradient(160deg, var(--gold), var(--gold-2)); color:var(--on-gold)}
  .tabs{position:fixed; left:0; right:0; bottom:0; display:flex;
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg-0) 70%, transparent)}
  .tabs .inner{display:flex; gap:4px; width:100%; max-width:560px; margin:0 auto;
    background:var(--well); border:1px solid var(--hair); border-radius:15px; padding:4px;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
  .tabs button{flex:1; padding:11px; border-radius:11px; font-size:15px; font-weight:600; color:var(--dim)}
  .tabs button[aria-current="true"]{background:var(--glass-2); color:var(--text)}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------- Speicher: Artefakt-Storage, sonst Browser, sonst nur Sitzung ---------- */
var VERSION = "2026-09-17.3";
var KEY = "wizard:state";
// Adresse des Vermittlers vor der Datenbank.
// Zum Wechseln des Anbieters nur diese Zeile anfassen.
var API = "https://spielblock-api.bencobi.workers.dev";
var store = (function(){
  if (window.storage && typeof window.storage.get === "function") {
    return {
      get: function(){ return window.storage.get(KEY).then(function(r){ return r ? r.value : null; }).catch(function(){ return null; }); },
      set: function(v){ try { window.storage.set(KEY, v); } catch(e){} }
    };
  }
  var ls = null;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ls = localStorage; } catch(e){}
  var mem = null;
  return {
    get: function(){ return Promise.resolve(ls ? ls.getItem(KEY) : mem); },
    set: function(v){ if (ls) { try { ls.setItem(KEY, v); } catch(e){} } else { mem = v; } }
  };
})();

/* ---------- Zustand ---------- */
var ALL = null;
var S = null;
var GAMES = [
  { id:"wizard",  name:"Wizard",   sub:"Stiche ansagen, Runde f\u00fcr Runde", low:false },
  { id:"kniffel", name:"Kniffel",  sub:"Dreizehn Felder, ein Block je Spieler", low:false },
  { id:"phase10", name:"Phase 10", sub:"Zehn Phasen, Restpunkte je Runde", low:true },
  { id:"skyjo",   name:"Skyjo",    sub:"Punkte sammeln bis 100, wenigste gewinnen", low:true },
  { id:"quiz",    name:"Quiz",     sub:"Sch\u00e4tz- und Wissensfragen, jeder am eigenen Handy", low:false },
  { id:"bluff",   name:"Bluff",    sub:"Antworten erfinden und andere hereinlegen", low:false },
  { id:"dito",    name:"Dito",     sub:"Dasselbe denken wie die anderen", low:false }
];
function fresh(){ return { theme:"light", cur:null, games:{}, history:[] }; }
function grenzen(id){
  if (id === "kniffel") return { min: 1, max: 8 };   // allein spielbar
  if (id === "skyjo")   return { min: 2, max: 8 };
  if (id === "quiz")    return { min: 2, max: 8 };
  if (id === "bluff")   return { min: 3, max: 8 };   // unter drei lohnt das Bluffen nicht
  if (id === "dito")    return { min: 3, max: 7 };
  if (id === "phase10") return { min: 2, max: 6 };
  return { min: 2, max: 6 };                          // Wizard, offiziell ab 3
}
function minSpieler(id){ return grenzen(id).min; }

function newGame(id, names){
  return { game:id, names:names || [], mode:"up", strict:false, versatz:0,
           rounds:[], draft:null, sheet:[], at:0, view:"round", logged:null, setup:true };
}
function lastNames(){
  var out = [];
  GAMES.forEach(function(g){
    var st = ALL.games[g.id];
    if (st && st.names.length && !out.length) out = st.names.slice();
  });
  return out;
}
function openGame(id){ ALL.cur = id; S = ALL.games[id]; }
function toHome(){ ALL.cur = null; S = null; }
function baseRounds(count){
  count = count || (S.names ? S.names.length : 0);
  if (!count) return 0;
  return Math.floor(60 / count);
}
function schedule(count, mode){
  var T = baseRounds(count), a = [], i;
  mode = mode || S.mode;
  if (!isFinite(T) || T < 1) return [];
  if (mode === "updown") {
    var peak = Math.ceil(T / 2);
    for (i = 1; i <= peak; i++) a.push(i);
    for (i = peak - 1; i >= 1; i--) a.push(i);
  } else {
    for (i = 1; i <= T; i++) a.push(i);
  }
  return a;
}
function maxOf(a){ return a.length ? Math.max.apply(null, a) : 0; }
function totalRounds(){ return schedule().length; }
function cardsFor(r){ return schedule()[r-1]; }
function roundNo(){ return S.rounds.length + 1; }
function points(bid, tricks){ return bid === tricks ? 20 + 10*tricks : -10*Math.abs(bid-tricks); }
function totals(){
  return S.names.map(function(_, i){
    return S.rounds.reduce(function(sum, r){ return sum + points(r.bids[i], r.tricks[i]); }, 0);
  });
}
function sum(a){ return a.reduce(function(x,y){ return x+y; }, 0); }
function save(){
  store.set(JSON.stringify(ALL));
  if (!wendetAn && S && S.live) liveSenden(false);
}

/* ---------- Hilfen ---------- */
var app = document.getElementById("app");
function el(html){ var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function signed(n){ return (n > 0 ? "+" : "") + n; }

var ENTWURF = {};   // getippter Text, damit er ein Neuzeichnen ueberlebt
var ENTWURF_FOKUS = null;

function merkeEingabe(feld, schluessel){
  var eingabe = feld.tagName === "INPUT" ? feld : feld.querySelector("input");
  if (!eingabe) return feld;
  if (ENTWURF[schluessel] !== undefined) eingabe.value = ENTWURF[schluessel];
  eingabe.addEventListener("input", function(){ ENTWURF[schluessel] = eingabe.value; });
  eingabe.addEventListener("focus", function(){ ENTWURF_FOKUS = schluessel; });
  eingabe.addEventListener("blur", function(){ if (ENTWURF_FOKUS === schluessel) ENTWURF_FOKUS = null; });
  if (ENTWURF_FOKUS === schluessel) {
    setTimeout(function(){
      try {
        eingabe.focus({ preventScroll: true });
        var n = eingabe.value.length;
        if (eingabe.setSelectionRange) eingabe.setSelectionRange(n, n);
      } catch (e) {}
    }, 0);
  }
  return feld;
}
function entwurfWeg(schluessel){
  delete ENTWURF[schluessel];
  if (ENTWURF_FOKUS === schluessel) ENTWURF_FOKUS = null;
}

function fmtZahl(n){
  if (n === null || n === undefined || !isFinite(Number(n))) return String(n);
  var z = Number(n), neg = z < 0, abs = Math.abs(z);
  var ganz = Math.floor(abs), rest = abs - ganz;
  var text = String(ganz).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  if (rest > 0.0001) {
    var nk = String(Math.round(rest * 100) / 100).slice(2, 4);
    if (nk) text += "," + nk;
  }
  return (neg ? "\u2212" : "") + text;
}
function fmtKurz(n){
  var abs = Math.abs(Number(n));
  if (abs >= 1000000) return fmtZahl(Math.round(Number(n) / 100000) / 10) + " Mio";
  return fmtZahl(n);
}
function parseZahl(text){
  var roh = String(text).replace(/[\s\u2212]/g, function(t){ return t === "\u2212" ? "-" : ""; })
                        .replace(/\./g, "").replace(",", ".");
  var v = parseFloat(roh);
  return isFinite(v) ? v : NaN;
}
// Trennt schon beim Tippen, damit Millionenwerte lesbar bleiben
function tausenderFeld(feld){
  var eingabe = feld.tagName === "INPUT" ? feld : feld.querySelector("input");
  if (!eingabe) return feld;
  eingabe.addEventListener("input", function(){
    var roh = eingabe.value;
    var neg = /^\s*-/.test(roh);
    var teile = roh.replace(/[^0-9,]/g, "").split(",");
    var ziffern = teile[0].replace(/^0+(?=\d)/, "");
    var text = ziffern ? ziffern.replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "";
    if (teile.length > 1) text += "," + teile[1].slice(0, 2);
    if (neg && text) text = "-" + text;
    if (text !== eingabe.value) {
      eingabe.value = text;
      try { eingabe.setSelectionRange(text.length, text.length); } catch (e) {}
    }
  });
  return feld;
}

function bindTap(btn, fn){
  var sx = 0, sy = 0, moved = false, touched = false;
  btn.addEventListener("touchstart", function(e){
    touched = true; moved = false;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive:true });
  btn.addEventListener("touchmove", function(e){
    if (Math.abs(e.touches[0].clientX - sx) > 8 || Math.abs(e.touches[0].clientY - sy) > 8) moved = true;
  }, { passive:true });
  btn.addEventListener("touchend", function(e){
    if (moved || btn.disabled) return;
    e.preventDefault();
    btn.classList.add("tap");
    fn();
  }, { passive:false });
  btn.addEventListener("click", function(){ if (!touched && !btn.disabled) fn(); });
}

var HUES = ["#E0982A", "#12A79B", "#E05A63", "#7B5BD6", "#6E9E22", "#2D82C7", "#C2568F", "#8A6A3B"];
function hue(i){ return HUES[i % HUES.length]; }

function strip(cur){
  var pl = schedule(), top = maxOf(pl) || 1;
  var bars = pl.map(function(c, i){
    var cls = i < cur - 1 ? "done" : (i === cur - 1 ? "now" : "");
    return '<i class="' + cls + '" style="height:' + Math.round(14 + 30 * (c / top)) + 'px"></i>';
  }).join("");
  return el('<div class="strip">' + bars + '</div>');
}

function stepper(value, max, isSet, onChange){
  var node = el(
    '<div class="stepper">' +
      '<button type="button" aria-label="weniger">\u2212</button>' +
      '<span class="val' + (isSet ? " set" : "") + '">' + value + '</span>' +
      '<button type="button" aria-label="mehr">+</button>' +
    '</div>');
  var minus = node.children[0], out = node.children[1], plus = node.children[2];
  minus.disabled = value <= 0;
  plus.disabled = value >= max;
  bindTap(minus, function(){ onChange(value - 1); });
  bindTap(plus, function(){ onChange(value + 1); });
  return node;
}

/* ---------- Bildschirm: Einrichtung ---------- */
function viewSetup(){
  var id = S.game;
  var meta = GAMES.filter(function(g){ return g.id === id; })[0];
  app.innerHTML = "";
  app.appendChild(el('<div class="top"><div class="brand"><span class="hat">\u25B2</span> ' + meta.name + '</div></div>'));
  app.querySelector(".top").appendChild(helpButton());

  var gr = grenzen(id), min = gr.min, max = gr.max;
  var names = S.names.length ? S.names.slice() : ["", "", ""].slice(0, Math.max(min, 3));
  while (names.length < min) names.push("");
  while (names.length > max) names.pop();
  var mode = S.mode || "up";
  var strict = !!S.strict;

  app.appendChild(el('<h1 class="headline">Wer spielt mit?</h1>'));
  app.appendChild(el('<p class="lead-in">' +
    (min === 1 ? "Von allein bis " + max : min + " bis " + max) +
    ' Spieler, in der Reihenfolge wie ihr am Tisch sitzt.</p>'));

  var list = el('<div></div>');
  app.appendChild(list);

  var addBtn = el('<button class="cta ghost" type="button">Spieler hinzuf\u00fcgen</button>');
  var hint = el('<p class="note"></p>');
  var startBtn = el('<button class="cta" type="button">Spiel starten</button>');

  var modeBox = el('<div class="modes">' +
    '<button type="button" data-m="up"><b>Normal</b><span>1 Karte hoch bis zum vollen Blatt</span></button>' +
    '<button type="button" data-m="updown"><b>Auf und ab</b><span>hoch bis zur H\u00e4lfte, dann zur\u00fcck auf 1</span></button>' +
    '</div>');
  var ruleBtn = el('<button class="toggle" type="button" aria-pressed="' + strict + '">' +
    '<span class="box">\u2713</span><span><b>Vorhand-Regel</b>' +
    '<span>Der Geber darf die Summe der Ansagen nicht genau aufgehen lassen.</span></span></button>');
  ruleBtn.onclick = function(){ strict = !strict; ruleBtn.setAttribute("aria-pressed", strict); };

  var losen = !!ALL.zufallStart;
  var losBtn = el('<button class="toggle" type="button" aria-pressed="' + losen + '">' +
    '<span class="box">\u2713</span><span><b>Geber auslosen</b>' +
    '<span>Wer gibt und wer anf\u00e4ngt, wird beim Start ausgew\u00fcrfelt. Die Sitzreihenfolge bleibt, ' +
    'wie ihr sie eingetragen habt.</span></span></button>');
  losBtn.onclick = function(){ losen = !losen; losBtn.setAttribute("aria-pressed", losen); };
  Array.prototype.forEach.call(modeBox.children, function(b){
    b.onclick = function(){ mode = b.dataset.m; paintMode(); };
  });
  function paintMode(){
    Array.prototype.forEach.call(modeBox.children, function(b){
      b.setAttribute("aria-current", b.dataset.m === mode ? "true" : "false");
    });
    info();
  }
  function info(){
    startBtn.disabled = names.length < min;
    if (id === "wizard") {
      var pl = schedule(names.length, mode);
      hint.textContent = names.length + " Spieler, " + pl.length + " Runden, h\u00f6chstens " + maxOf(pl) + " Karten" +
        (names.length < 3 ? " \u00b7 offiziell ab 3 Spielern" : "");
    } else if (id === "kniffel") {
      hint.textContent = (names.length === 1 ? "allein" : names.length + " Spieler") + ", je 13 Felder";
    } else if (id === "phase10") {
      hint.textContent = names.length + " Spieler, zehn Phasen der Reihe nach";
    } else {
      hint.textContent = names.length + " Spieler, Schluss bei 100 Punkten";
    }
  }

  function paint(){
    list.innerHTML = "";
    names.forEach(function(n, i){
      var row = el('<div class="pinput"><i style="--acc:' + hue(i) + '"></i>' +
        '<input type="text" inputmode="text" autocomplete="off" placeholder="Spieler ' + (i+1) + '" value="' + esc(n) + '">' +
        (names.length > min ? '<button class="rm" type="button" aria-label="entfernen">\u00d7</button>' : '') + '</div>');
      var input = row.querySelector("input");
      input.oninput = function(){ names[i] = input.value; };
      var rm = row.querySelector(".rm");
      if (rm) rm.onclick = function(){ names.splice(i, 1); paint(); };
      list.appendChild(row);
    });
    addBtn.disabled = names.length >= max;
    info();
  }
  addBtn.onclick = function(){ if (names.length < max) { names.push(""); paint(); } };

  startBtn.onclick = function(){
    S.names = names.map(function(n, i){ return n.trim() || ("Spieler " + (i+1)); });
    // Sitzreihenfolge bleibt, nur wer zuerst gibt wird ausgelost
    ALL.zufallStart = losen;
    // Die Sitzreihenfolge bleibt, nur wer zuerst gibt wird ausgelost
    S.versatz = losen ? Math.floor(Math.random() * S.names.length) : 0;
    S.mode = mode;
    S.strict = strict;
    S.sheet = S.names.map(function(){ return {}; });
    S.rounds = [];
    S.draft = null;
    S.at = 0;
    S.view = "round";
    S.logged = null;
    S.setup = false;
    save(); render();
  };

  if (id === "wizard") { app.appendChild(modeBox); app.appendChild(ruleBtn); app.appendChild(losBtn); }
  else if (id === "phase10") { app.appendChild(losBtn); }
  app.appendChild(addBtn);
  app.appendChild(startBtn);
  var back = el('<button class="cta ghost" type="button">Zur\u00fcck zum Hauptmen\u00fc</button>');
  back.onclick = function(){
    if (!S.names.length) delete ALL.games[id];
    toHome(); save(); render();
  };
  app.appendChild(back);
  app.appendChild(hint);
  if (id === "wizard") {
    app.appendChild(el('<div class="rules"><b>Punkte</b> \u00b7 Ansage getroffen: 20 Punkte plus 10 je Stich. ' +
      'Daneben: 10 Punkte Abzug je Stich Differenz.</div>'));
  }
  paint();
  paintMode();
}

/* ---------- Bildschirm: Runde ---------- */
function viewRound(){
  var n = roundNo(), max = cardsFor(n), tot = totals();
  if (!S.draft) S.draft = { phase:"bid", bids:S.names.map(function(){ return 0; }), tricks:S.names.map(function(){ return 0; }) };
  var d = S.draft;
  var bidding = d.phase === "bid";
  var vals = bidding ? d.bids : d.tricks;
  var have = sum(vals);

  app.innerHTML = "";
  app.appendChild(el('<div class="top"><div class="brand"><span class="hat">\u25B2</span> Wizard</div></div>'));
  topBtns();
  app.appendChild(strip(n));

  var count = S.names.length;
  var dealer = (n - 1 + (S.versatz || 0)) % count;
  var left = 60 - max*count;
  var offBy = have !== max;

  app.appendChild(el('<h1 class="headline num">' + max + (max === 1 ? ' Karte ' : ' Karten ') +
    '<em>Runde ' + n + ' von ' + totalRounds() + '</em></h1>'));
  app.appendChild(el('<p class="meta">' + esc(S.names[dealer]) + ' gibt, ' +
    (left === 0 ? 'nichts bleibt liegen, also kein Trumpf' : left + ' Karten bleiben liegen') + '.</p>'));

  app.appendChild(el(
    '<div class="phase"><h2>' + (bidding ? "Ansagen" : "Stiche eintragen") + '</h2>' +
    '<div class="tally' + (!bidding && offBy ? " bad" : "") + '">' +
    '<b class="num">' + have + '</b> von ' + max + (bidding ? ' angesagt' : ' verteilt') + '</div></div>'));

  var order = [];
  for (var k = 0; k < count; k++) order.push((dealer + 1 + k) % count);

  order.forEach(function(i, seat){
    var badge = i === dealer ? '<span class="badge">gibt</span>'
              : (seat === 0 ? '<span class="badge">beginnt</span>' : '');
    var best = Math.max.apply(null, tot);
    var row = el('<div class="row' + (S.rounds.length && tot[i] === best ? ' leader' : '') +
      '" style="--acc:' + hue(i) + '"><div class="who"><div class="name"><span class="nm">' +
      esc(S.names[i]) + '</span>' + badge + '</div></div></div>');
    var who = row.querySelector(".who");
    if (bidding) {
      var last = S.rounds.length ? S.rounds[S.rounds.length-1] : null;
      var delta = last ? points(last.bids[i], last.tricks[i]) : null;
      who.appendChild(el('<div class="sub"><span class="num">' + tot[i] + '</span> Punkte' +
        (delta === null ? '' : '<span class="chip' + (delta > 0 ? '' : ' down') + '">' + signed(delta) + '</span>') +
        '</div>'));
    } else {
      var p = points(d.bids[i], d.tricks[i]);
      who.appendChild(el('<div class="sub">sagt <span class="said num">' + d.bids[i] + '</span>' +
        '<span class="chip' + (p > 0 ? '' : ' down') + '">' + signed(p) + '</span></div>'));
    }
    row.appendChild(stepper(vals[i], max, vals[i] > 0, function(v){
      vals[i] = v; save(); render();
    }));
    app.appendChild(row);
  });

  var note = el('<p class="note"></p>');
  if (bidding) {
    var blocked = S.strict && have === max;
    var cta = el('<button class="cta" type="button">Weiter zu den Stichen</button>');
    cta.disabled = blocked;
    cta.onclick = function(){ d.phase = "tricks"; d.tricks = S.names.map(function(){ return 0; }); save(); render(); };
    app.appendChild(cta);
    if (blocked) {
      note.className = "note warn";
      note.textContent = "Die Summe geht genau auf. " + S.names[dealer] + " muss eine andere Zahl ansagen.";
    } else if (S.strict) {
      note.textContent = "Vorhand-Regel: " + S.names[dealer] + " sagt zuletzt an und darf nicht auf " + max + " auff\u00fcllen.";
    } else {
      note.textContent = have === max
        ? "Summe passt genau, hier darf das jeder ansagen."
        : "Reihenfolge von oben nach unten, " + S.names[dealer] + " sagt zuletzt an.";
    }
  } else {
    var done = el('<button class="cta" type="button">Runde eintragen</button>');
    done.disabled = offBy;
    done.onclick = function(){
      S.rounds.push({ bids:d.bids.slice(), tricks:d.tricks.slice() });
      S.draft = null; save(); render();
    };
    app.appendChild(done);
    var back = el('<button class="cta ghost" type="button">Zur\u00fcck zu den Ansagen</button>');
    back.onclick = function(){ d.phase = "bid"; save(); render(); };
    app.appendChild(back);
    if (offBy) {
      note.className = "note warn";
      note.textContent = have < max
        ? "Es fehlen noch " + (max - have) + " Stiche."
        : (have - max) + " Stiche zu viel.";
    }
  }
  app.appendChild(note);
  app.appendChild(tabs());
}

/* ---------- Bildschirm: Tabelle ---------- */
function viewTable(){
  var tot = totals(), best = Math.max.apply(null, tot);
  app.innerHTML = "";
  app.appendChild(el('<div class="top"><div class="brand"><span class="hat">\u25B2</span> Wizard</div></div>'));
  topBtns();
  app.appendChild(el('<h1 class="headline num">' + S.rounds.length + ' <em>von ' + totalRounds() + ' Runden gespielt</em></h1>'));
  app.appendChild(el('<p class="meta">Je Runde die Ansage, die Stiche und der Stand danach.</p>'));

  if (!S.rounds.length) {
    app.appendChild(el('<p class="lead-in">Noch keine Runde eingetragen. Die Tabelle f\u00fcllt sich, sobald die erste Runde steht.</p>'));
    app.appendChild(tabs());

  }

  var head = '<tr><th class="rnd">Rd</th>' + S.names.map(function(nm, i){
    return '<th><i style="--acc:' + hue(i) + '"></i>' +
      esc(nm.length > 8 ? nm.slice(0,8) + "\u2026" : nm) + '</th>'; }).join("") + '</tr>';

  var run = S.names.map(function(){ return 0; });
  var body = S.rounds.map(function(r, ri){
    var cells = S.names.map(function(_, i){
      var p = points(r.bids[i], r.tricks[i]);
      run[i] += p;
      return '<td><span class="bid ' + (p > 0 ? "hit" : "miss") + '">' + r.bids[i] + "/" + r.tricks[i] +
             '</span>' + run[i] + '</td>';
    }).join("");
    return '<tr><td class="rnd">' + (ri+1) + '<span class="cards">' + cardsFor(ri+1) + ' K</span></td>' + cells + '</tr>';
  }).join("");

  var foot = '<tr><th class="rnd">Stand</th>' + tot.map(function(t){
    return '<td' + (t === best ? ' class="lead"' : '') + '>' + t + '</td>'; }).join("") + '</tr>';

  app.appendChild(el('<div class="scroller"><table><thead>' + head + '</thead><tbody>' + body +
                     '</tbody><tfoot>' + foot + '</tfoot></table></div>'));

  var undo = el('<button class="cta ghost" type="button">Letzte Runde l\u00f6schen</button>');
  undo.onclick = function(){ if (confirm("Runde " + S.rounds.length + " l\u00f6schen?")) { S.rounds.pop(); S.draft = null; save(); render(); } };
  app.appendChild(undo);
  app.appendChild(tabs());
}

/* ---------- Bildschirm: Schluss ---------- */
function viewFinal(){
  var tot = totals();
  var order = S.names.map(function(nm, i){ return { nm:nm, pt:tot[i], idx:i }; })
                     .sort(function(a,b){ return b.pt - a.pt; });
  app.innerHTML = "";
  app.appendChild(el('<div class="top"><div class="brand"><span class="hat">\u25B2</span> Wizard</div></div>'));
  topBtns();
  app.appendChild(el('<div class="final"><h2>' + esc(order[0].nm) + ' gewinnt</h2>' +
                     '<p>Nach ' + totalRounds() + ' Runden mit ' + order[0].pt + ' Punkten.</p></div>'));
  order.forEach(function(p, i){
    app.appendChild(el('<div class="rank' + (i === 0 ? ' first' : '') + '" style="--acc:' + hue(p.idx) + '">' +
                       '<span class="pos num">' + (i+1) + '</span>' +
                       '<span class="nm">' + esc(p.nm) + '</span>' +
                       '<span class="pt num">' + p.pt + '</span></div>'));
  });
  var stats = el('<div class="stats"><h3>Auswertung</h3></div>');
  function line(label, value){
    stats.appendChild(el('<div><span>' + label + '</span><b>' + value + '</b></div>'));
  }

  var hits = S.names.map(function(_, i){
    return S.rounds.filter(function(r){ return r.bids[i] === r.tricks[i]; }).length;
  });
  var over = S.names.map(function(_, i){
    return S.rounds.filter(function(r){ return r.bids[i] > r.tricks[i]; }).length;
  });
  var bestRound = { pt:-999, who:"", nr:0 };
  S.rounds.forEach(function(r, ri){
    S.names.forEach(function(nm, i){
      var pt = points(r.bids[i], r.tricks[i]);
      if (pt > bestRound.pt) bestRound = { pt:pt, who:nm, nr:ri+1 };
    });
  });
  var topHit = 0; hits.forEach(function(h, i){ if (h > hits[topHit]) topHit = i; });
  var topOver = 0; over.forEach(function(o, i){ if (o > over[topOver]) topOver = i; });
  var rounds = S.rounds.length;

  line("Beste Einzelrunde", esc(bestRound.who) + ' <em>' + signed(bestRound.pt) + ' in Runde ' + bestRound.nr + '</em>');
  line("Sicherste Ansagen", esc(S.names[topHit]) + ' <em>' + hits[topHit] + ' von ' + rounds + ' getroffen</em>');
  if (over[topOver] > 0) {
    line("Am h\u00e4ufigsten \u00fcbersch\u00e4tzt", esc(S.names[topOver]) + ' <em>' + over[topOver] + ' mal zu hoch</em>');
  }
  line("Trefferquote der Runde", Math.round(100 * sum(hits) / (rounds * S.names.length)) + ' <em>Prozent aller Ansagen</em>');
  app.appendChild(stats);

  app.appendChild(logButton(order));
  var again = el('<button class="cta" type="button"' + ((S.live && !S.hostet) ? ' disabled' : '') +
    '>Neues Spiel, gleiche Runde</button>');
  again.onclick = function(){ S.rounds = []; S.draft = null; S.logged = null; save(); render(); };
  app.appendChild(again);
  if (!(S.live && !S.hostet)) {
    var reset = el('<button class="cta ghost" type="button">Spieler \u00e4ndern</button>');
    reset.onclick = function(){ S.setup = true; save(); render(); };
    app.appendChild(reset);
  }
  app.appendChild(tabs());
}


/* ---------- Kniffel ---------- */
function span(from, to){ var a = []; for (var i = from; i <= to; i++) a.push(i); return a; }
var CATS = [
  { id:"e1", name:"Einer",         part:"top",    vals:span(0,5),  hint:"Nur die Einsen z\u00e4hlen" },
  { id:"e2", name:"Zweier",        part:"top",    vals:[0,2,4,6,8,10] },
  { id:"e3", name:"Dreier",        part:"top",    vals:[0,3,6,9,12,15] },
  { id:"e4", name:"Vierer",        part:"top",    vals:[0,4,8,12,16,20] },
  { id:"e5", name:"F\u00fcnfer",  part:"top",    vals:[0,5,10,15,20,25] },
  { id:"e6", name:"Sechser",       part:"top",    vals:[0,6,12,18,24,30] },
  { id:"d3", name:"Dreierpasch",   part:"bottom", vals:[0].concat(span(5,30)), hint:"Summe aller f\u00fcnf W\u00fcrfel" },
  { id:"d4", name:"Viererpasch",   part:"bottom", vals:[0].concat(span(5,30)), hint:"Summe aller f\u00fcnf W\u00fcrfel" },
  { id:"fh", name:"Full House",    part:"bottom", vals:[0,25] },
  { id:"ks", name:"Kleine Stra\u00dfe", part:"bottom", vals:[0,30] },
  { id:"gs", name:"Gro\u00dfe Stra\u00dfe",  part:"bottom", vals:[0,40] },
  { id:"kn", name:"Kniffel",       part:"bottom", vals:[0,50] },
  { id:"ch", name:"Chance",        part:"bottom", vals:[0].concat(span(5,30)), hint:"Summe aller f\u00fcnf W\u00fcrfel" }
];
function cell(pi, id){
  var v = S.sheet && S.sheet[pi] ? S.sheet[pi][id] : null;
  return (v === undefined) ? null : v;
}
function partSum(pi, part){
  return CATS.reduce(function(a, c){
    return a + (c.part === part && typeof cell(pi, c.id) === "number" ? cell(pi, c.id) : 0);
  }, 0);
}
function bonusOf(pi){ return partSum(pi, "top") >= 63 ? 35 : 0; }
function totalOf(pi){ return partSum(pi, "top") + bonusOf(pi) + partSum(pi, "bottom"); }
function filledOf(pi){
  return CATS.filter(function(c){ return typeof cell(pi, c.id) === "number"; }).length;
}
function kniffelDone(){
  return S.names.every(function(_, i){ return filledOf(i) === CATS.length; });
}

function valueSheet(title, cat, cur, onPick){
  var note = (cat.hint ? cat.hint + ". " : "") + "Null bedeutet streichen.";
  var sheet = el('<div class="sheet"><div class="panel scrollable"><div class="head">' + title + '</div>' +

  document.body.appendChild(sheet);
}

/* ---------- Phase 10 ---------- */
var PHASES = [
  "2 Drillinge",
  "1 Drilling und 1 Folge aus 4",
  "1 Vierling und 1 Folge aus 4",
  "1 Folge aus 7 Karten",
  "1 Folge aus 8 Karten",
  "1 Folge aus 9 Karten",
  "2 Vierlinge",
  "7 Karten einer Farbe",
  "1 F\u00fcnfling und 1 Paar",
  "1 F\u00fcnfling und 1 Drilling"
];
var CARDVALS = [
  { name:"Karten 1 bis 9", sub:"je 5 Punkte", v:5, max:10 },
  { name:"Karten 10 bis 12", sub:"je 10 Punkte", v:10, max:10 },
  { name:"Aussetzen", sub:"je 15 Punkte, 4 im Deck", v:15, max:4 },
  { name:"Joker", sub:"je 25 Punkte, 8 im Deck", v:25, max:8 }
];
function phaseOf(pi){
  var done = S.rounds.filter(function(r){ return r.done[pi]; }).length;
  return Math.min(done + 1, 10);
}
function clearedTen(pi){
  return S.rounds.filter(function(r){ return r.done[pi]; }).length >= 10;
}
function p10Points(pi){
  return S.rounds.reduce(function(a, r){ return a + r.pts[pi]; }, 0);
}
function p10Done(){ return S.names.some(function(_, i){ return clearedTen(i); }); }

function counterSheet(cur, onPick){
  var counts = [0, 0, 0, 0];
  var sheet = el('<div class="sheet"><div class="panel"><div class="head">Restkarten z\u00e4hlen</div>' +
    '<p class="hintline" style="padding:0 16px 2px">Wie viele Karten hatte der Spieler noch auf der Hand?</p>' +
    '<div class="counter"></div></div></div>');
  var box = sheet.querySelector(".counter");
  var summe = el('<div class="total"><span></span><span class="num"></span></div>');
  var ok = el('<button type="button"></button>');

  function sum4(){ return counts.reduce(function(a, c, i){ return a + c * CARDVALS[i].v; }, 0); }
  function frisch(){
    var karten = counts.reduce(function(a, c){ return a + c; }, 0);
    summe.firstElementChild.textContent = karten + (karten === 1 ? " Karte" : " Karten");
    summe.firstElementChild.style.color = karten > 10 ? "var(--miss)" : "";
    summe.lastElementChild.textContent = sum4() + " Punkte";
    ok.textContent = "\u00dcbernehmen, " + sum4() + " Punkte";
  }

  // Die Zeilen werden einmal gebaut und danach nur noch beschriftet.
  // Vorher wurde bei jedem Tipp alles neu aufgebaut, dabei verschwand
  // der Knopf unter dem Finger.
  CARDVALS.forEach(function(c, i){
    var zeile = el('<div class="crow"><div><b>' + c.name + '</b><span>' + c.sub + '</span></div>' +
      '<div class="stepper"><button type="button" aria-label="weniger">\u2212</button>' +
      '<span class="val">0</span>' +
      '<button type="button" aria-label="mehr">+</button></div></div>');
    var st = zeile.querySelector(".stepper");
    var minus = st.children[0], wert = st.children[1], plus = st.children[2];
    function zeige(){
      wert.textContent = counts[i];
      wert.className = "val" + (counts[i] > 0 ? " set" : "");
      minus.disabled = counts[i] <= 0;
      plus.disabled = counts[i] >= c.max;
      frisch();
    }
    bindTap(minus, function(){ if (counts[i] > 0) { counts[i]--; zeige(); } });
    bindTap(plus, function(){ if (counts[i] < c.max) { counts[i]++; zeige(); } });
    box.appendChild(zeile);
    zeige();
  });
  box.appendChild(summe);

  ok.onclick = function(){ sheet.remove(); onPick(sum4()); };
  var cancel = el('<button type="button">Abbrechen</button>');
  cancel.onclick = function(){ sheet.remove(); };
  sheet.querySelector(".panel").appendChild(ok);
  sheet.querySelector(".panel").appendChild(cancel);
  sheet.onclick = function(e){ if (e.target === sheet) sheet.remove(); };
  document.body.appendChild(sheet);
  frisch();
}

    (min > 0 ? ' Ohne ausgelegte Phase sind es genau zehn Karten, also mindestens 50.' : '') + '</p>' +

function viewPhase(){
  var n = S.rounds.length + 1;
  if (!S.draft) S.draft = { done:S.names.map(function(){ return false; }), pts:S.names.map(function(){ return 0; }) };
  var d = S.draft;
  app.innerHTML = "";
  app.appendChild(el('<div class="top"><div class="brand"><span class="hat">\u25B2</span> Phase 10</div></div>'));
  topBtns();
  var anzahl = S.names.length;
  var geber = (n - 1 + (S.versatz || 0)) % anzahl;
  app.appendChild(el('<h1 class="headline num">Runde ' + n + '</h1>'));
  app.appendChild(el('<p class="meta">' + esc(S.names[geber]) + ' gibt, ' +
    esc(S.names[(geber + 1) % anzahl]) + ' f\u00e4ngt an. Haken setzen, wer seine Phase geschafft hat.</p>'));

  var reihe = [];
  for (var k = 0; k < anzahl; k++) reihe.push((geber + 1 + k) % anzahl);

  reihe.forEach(function(i, platz){
    var nm = S.names[i];
    var ph = phaseOf(i);
    var zeichen = i === geber ? '<span class="badge">gibt</span>'
                : (platz === 0 ? '<span class="badge">beginnt</span>' : '');
    var row = el('<div class="row" style="--acc:' + hue(i) + '"><div class="who">' +
      '<div class="name"><span class="nm">' + esc(nm) + '</span>' + zeichen +
      '<span class="badge">Phase ' + ph + '</span></div>' +
      '<div class="sub wrap">' + PHASES[ph-1] + '</div></div>' +
      '<div class="acts"></div></div>');
    var acts = row.querySelector(".acts");

    var chk = el('<button class="check" type="button" aria-pressed="' + d.done[i] + '" aria-label="Phase geschafft">\u2713</button>');
    bindTap(chk, function(){
      d.done[i] = !d.done[i];
      if (!d.done[i] && d.pts[i] < 50) d.pts[i] = 50;
      save(); render();
    });
    acts.appendChild(chk);

    var pill = el('<button class="pill num' + (d.pts[i] === 0 ? ' zero' : '') + '" type="button">' + d.pts[i] + '</button>');
    bindTap(pill, function(){
      pointsSheet("Restpunkte, " + nm, d.pts[i], d.done[i] ? 0 : 50, function(v){ d.pts[i] = v; save(); render(); });
    });
    acts.appendChild(pill);
    app.appendChild(row);
  });

  var stuck = S.names.filter(function(_, i){ return !d.done[i] && d.pts[i] < 50; });
  var zeros = d.pts.filter(function(v){ return v === 0; }).length;

  var cta = el('<button class="cta" type="button">Runde eintragen</button>');
  cta.disabled = stuck.length > 0;
  cta.onclick = function(){

        : stuck[0];

  }
  app.appendChild(note);
  app.appendChild(tabs());
}

function keypadSheet(title, cur, onPick){
  var txt = (typeof cur === "number") ? String(cur) : "";
  var sheet = el('<div class="sheet"><div class="panel"><div class="head">' + title + '</div>' +
    '<p class="keyval empty">0</p><div class="keypad"></div></div></div>');
  var out = sheet.querySelector(".keyval");
  var pad = sheet.querySelector(".keypad");
  function paint(){
    out.textContent = txt === "" || txt === "-" ? (txt === "-" ? "-0" : "0") : txt;
    out.className = "keyval" + (txt === "" ? " empty" : "");
  }
  function press(k){
    if (k === "+/-") txt = txt.charAt(0) === "-" ? txt.slice(1) : "-" + txt;
    else if (k === "del") txt = txt.slice(0, -1);
    else if ((txt.replace("-", "")).length < 3) txt += k;
    paint();
  }
  ["1","2","3","4","5","6","7","8","9","+/-","0","del"].forEach(function(k){
    var b = el('<button type="button">' + (k === "del" ? "\u232b" : k) + '</button>');
    b.onclick = function(){ press(k); };
    pad.appendChild(b);
  });
  var ok = el('<button class="wide" type="button">\u00dcbernehmen</button>');
  ok.onclick = function(){
    var v = parseInt(txt, 10);
    if (isNaN(v)) v = 0;
    v = Math.max(-30, Math.min(200, v));
    sheet.remove(); onPick(v);
  };
  pad.appendChild(ok);
  var cancel = el('<button type="button">Abbrechen</button>');
  cancel.onclick = function(){ sheet.remove(); };
  sheet.querySelector(".panel").appendChild(cancel);
  sheet.onclick = function(e){ if (e.target === sheet) sheet.remove(); };
  document.body.appendChild(sheet);
  paint();
}

function skyjoFinal(raw, ender, i){
  var v = raw[i];
  if (i !== ender || typeof v !== "number" || v <= 0) return v;
  var beaten = raw.some(function(o, k){ return k !== ender && typeof o === "number" && o <= v; });
  return beaten ? v * 2 : v;
}
function skyjoTotal(i){
  return S.rounds.reduce(function(a, r){ return a + skyjoFinal(r.raw, r.ender, i); }, 0);
}
function skyjoDone(){
  return S.rounds.length > 0 && S.names.some(function(_, i){ return skyjoTotal(i) >= 100; });
}

function statusOf(id){
  var st = ALL.games[id];
  if (!st || !st.names.length || st.setup) return null;
  var prev = S, txt = "";
  S = st;
  try {
    if (id === "wizard") {
      txt = st.rounds.length >= totalRounds()
        ? "fertig, Ergebnis steht"
        : "Runde " + (st.rounds.length + 1) + " von " + totalRounds();
    } else if (id === "kniffel") {
      var filled = st.names.reduce(function(a, _, i){ return a + filledOf(i); }, 0);
      txt = kniffelDone() ? "fertig, Ergebnis steht"
                          : filled + " von " + (st.names.length * CATS.length) + " Feldern";
    } else if (id === "phase10") {
      var top = Math.max.apply(null, st.names.map(function(_, i){ return phaseOf(i); }));
      txt = p10Done() ? "fertig, Ergebnis steht"
                      : "Runde " + (st.rounds.length + 1) + ", h\u00f6chste Phase " + top;
    } else {
      var high = st.rounds.length ? Math.max.apply(null, st.names.map(function(_, i){ return skyjoTotal(i); })) : 0;
      txt = skyjoDone() ? "fertig, Ergebnis steht"
                        : "Runde " + (st.rounds.length + 1) + ", Stand " + high + " von 100";
    }
  } catch(e){ txt = ""; }
  S = prev;
  return txt ? { txt:txt, who:st.names.join(", ") } : null;
}

/* ---------- Gruppe und Abgleich ---------- */
var syncing = false;
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    var r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
function normCode(v){
  return (v || "").trim().toUpperCase().replace(/[^A-Z0-9-]/g, "");
}
function groupCode(){
  var abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", out = "";
  for (var i = 0; i < 8; i++) out += abc.charAt(Math.floor(Math.random() * abc.length));
  return out;
}
function rpc(name, body){
  return fetch(API + "/rpc/" + name, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(body)
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t.slice(0, 120)); });
    return r.status === 204 ? null : r.json();
  });
}
function syncNow(){
  if (!ALL.group || syncing) return Promise.resolve();
  syncing = true;
  ALL.syncTry = Date.now();
  ALL.syncErr = null;
  var code = ALL.group;
  var open = ALL.history.filter(function(h){ return !h.synced; });
  return open.reduce(function(chain, h){
    return chain.then(function(){
      return rpc("partie_speichern", {
        p_code: code, p_id: h.id, p_spiel: h.game, p_datum: h.date, p_ergebnis: h.rows
      }).then(function(){ h.synced = true; });
    });
  }, Promise.resolve())
  .then(function(){ return rpc("partien_lesen", { p_code: code }); })
  .then(function(rows){
    var known = {};
    ALL.history.forEach(function(h){ known[h.id] = h; });
    (rows || []).forEach(function(r){
      var entry = { id: r.id, game: r.spiel, date: String(r.gespielt_am).slice(0, 10),
                    rows: r.ergebnis, synced: true };
      if (known[r.id]) {
        known[r.id].rows = entry.rows;
        known[r.id].game = entry.game;
        known[r.id].date = entry.date;
        known[r.id].synced = true;
      } else {
        ALL.history.push(entry);
      }
    });
    ALL.history.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    ALL.syncAt = Date.now();
  })
  .catch(function(e){ ALL.syncErr = e.message || "Abgleich fehlgeschlagen"; })
  .then(function(){ syncing = false; save(); render(); });
}
function syncLine(){
  if (ALL.syncErr) return "Abgleich fehlgeschlagen: " + ALL.syncErr;
  if (syncing) return "gleicht ab \u2026";
  if (!ALL.syncAt) return "noch nicht abgeglichen";
  var d = new Date(ALL.syncAt);
  return "zuletzt abgeglichen " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

    ALL.history.push({
      id: neueId,
      game: S.game,
      date: new Date().toISOString().slice(0, 10),
      rows: order.map(function(p){ return { name:p.nm, pts:p.pt }; }),
      synced: false
    });
    if (ALL.history.length > 200) ALL.history = ALL.history.slice(-200);
    S.logged = neueId;
    save(); render();
    if (ALL.group) syncNow();
  };
  return b;
}


function renamePlayer(from, to){
  to = to.trim();
  if (!to) return;
  var key = from.trim().toLowerCase();
  ALL.history.forEach(function(h){
    h.rows.forEach(function(r){
      if (String(r.name).trim().toLowerCase() === key) r.name = to;
    });
  });
  save();
  if (ALL.group) {
    rpc("namen_umbenennen", { p_code: ALL.group, p_von: from, p_nach: to })
      .then(function(){ ALL.syncErr = null; })
      .catch(function(e){ ALL.syncErr = "Umbenennen nicht \u00fcbertragen: " + (e.message || ""); })
      .then(function(){ save(); render(); });
  } else {
    render();
  }
}

function playerSheet(name, others){
  var sheet = el('<div class="sheet"><div class="panel scrollable"><div class="head">' + esc(name) + '</div>' +
    '<p class="hintline" style="padding:0 16px">Zusammenf\u00fchren, wenn derselbe Spieler doppelt in der Liste steht.</p>' +
    '</div></div>');
  var panel = sheet.querySelector(".panel");
  function item(label, cls, fn){
    var b = el('<button type="button"' + (cls ? ' class="' + cls + '"' : '') + '>' + label + '</button>');
    b.onclick = function(){ sheet.remove(); fn(); };
    panel.appendChild(b);
  }
  others.forEach(function(o){
    item("Mit " + esc(o) + " zusammenf\u00fchren", "", function(){
      if (confirm(name + " und " + o + " zusammenf\u00fchren? Alle Partien laufen danach auf " + o + ".")) {
        renamePlayer(name, o);
      }
    });
  });
  item("Namen \u00e4ndern", "", function(){
    var neu = prompt("Neuer Name f\u00fcr " + name, name);
    if (neu) renamePlayer(name, neu);
  });
  item("Abbrechen", "", function(){});
  sheet.onclick = function(e){ if (e.target === sheet) sheet.remove(); };
  document.body.appendChild(sheet);
}

function groupBox(){
  var box = el('<div></div>');
  box.appendChild(el('<p class="group">Gruppe</p>'));

  if (!ALL.group) {
    box.appendChild(el('<p class="lead-in">Ohne Gruppe bleibt die Liste auf diesem Ger\u00e4t. ' +
      'Mit Gruppe sehen alle dieselben Partien, sobald sie den Code eingeben. ' +
      'Den Code w\u00e4hlst du selbst, er sollte aber nicht zu leicht zu erraten sein.</p>'));
    var mk = el('<button class="cta" type="button">Gruppe erstellen</button>');
    mk.onclick = function(){
      var code = normCode(prompt("Code f\u00fcr eure Gruppe festlegen. Buchstaben, Ziffern und Bindestrich, " +
        "mindestens sechs Zeichen. Wer ihn kennt, sieht eure Liste.", groupCode()));
      if (!code) return;
      if (code.length < 6) { alert("Der Code braucht mindestens sechs Zeichen."); return; }
      ALL.group = code;
      ALL.history.forEach(function(h){ if (!h.id) h.id = uuid(); h.synced = false; });
      save(); render(); syncNow();
    };
    box.appendChild(mk);
    var join = el('<button class="cta ghost" type="button">Gruppe beitreten</button>');
    join.onclick = function(){
      var code = normCode(prompt("Gruppencode eingeben"));
      if (!code) return;
      if (code.length < 6) { alert("Der Code braucht mindestens sechs Zeichen."); return; }
      ALL.group = code;
      ALL.history.forEach(function(h){ if (!h.id) h.id = uuid(); h.synced = false; });
      save(); render(); syncNow();
    };
    box.appendChild(join);
    return box;
  }

  box.appendChild(el('<div class="line sum"><span>Code</span><span class="v">' + esc(ALL.group) + '</span></div>'));
  box.appendChild(el('<p class="hintline">' + syncLine() + '. Wer den Code eintr\u00e4gt, sieht dieselbe Liste.</p>'));

  var now = el('<button class="cta" type="button">Jetzt abgleichen</button>');
  now.disabled = syncing;
  now.onclick = function(){ syncNow(); };
  box.appendChild(now);

  if (navigator.share || navigator.clipboard) {
    var share = el('<button class="cta ghost" type="button">Code teilen</button>');
    share.onclick = function(){
      var txt = "Unsere Spielblock-Gruppe: " + ALL.group;
      if (navigator.share) navigator.share({ text: txt }).catch(function(){});
      else navigator.clipboard.writeText(ALL.group);
    };
    box.appendChild(share);
  }

  var leave = el('<button class="cta ghost" type="button">Gruppe verlassen</button>');
  leave.onclick = function(){
    if (confirm("Gruppe verlassen? Die Liste bleibt lokal erhalten.")) {
      ALL.group = null; ALL.syncAt = null; ALL.syncErr = null; save(); render();
    }
  };
  box.appendChild(leave);
  return box;
}

function nameKey(n){ return String(n).trim().toLowerCase(); }
function platzVon(h, key){
  for (var i = 0; i < h.rows.length; i++) {
    if (nameKey(h.rows[i].name) === key) return i;
  }
  return -1;
}

function viewStats(){
  var filter = ALL.filter || "all";
  var list = ALL.history.filter(function(h){ return filter === "all" || h.game === filter; });

  app.innerHTML = "";
  app.appendChild(el('<div class="top"><div class="brand"><span class="hat">\u25B2</span> Ewige Tabelle</div></div>'));
  var back = el('<button class="menubtn" type="button" aria-label="zur\u00fcck">\u2039</button>');
  back.onclick = function(){ ALL.view = null; save(); render(); };
  app.querySelector(".top").appendChild(back);

  if (ALL.group && !syncing && Date.now() - (ALL.syncTry || 0) > 60000) syncNow();

  var chips = el('<div class="players"></div>');
  [{ id:"all", name:"Alle" }].concat(GAMES).forEach(function(g){
    var b = el('<button type="button" aria-current="' + (filter === g.id) + '">' + g.name + '</button>');
    b.onclick = function(){ ALL.filter = g.id; save(); render(); };
    chips.appendChild(b);
  });
  app.appendChild(chips);

  if (!list.length) {
    app.appendChild(el('<h1 class="headline">Noch nichts drin</h1>'));
    app.appendChild(el('<p class="lead-in">Am Ende einer Partie entscheidest du, ob sie hier landet. ' +
      'Danach stehen hier Siege, Partien und Bestwerte.</p>'));
    app.appendChild(groupBox());
    return;
  }

  var by = {};
  list.forEach(function(h){
    var info = gameInfo(h.game);
    h.rows.forEach(function(r, idx){
      var key = nameKey(r.name);
      if (!by[key]) by[key] = { key:key, name:r.name, games:0, wins:0, best:null, sum:0 };
      var p = by[key];
      p.games++;
      if (idx === 0) p.wins++;
      p.sum += r.pts;
      if (p.best === null) p.best = r.pts;
      else if (info && info.low) p.best = Math.min(p.best, r.pts);
      else p.best = Math.max(p.best, r.pts);
    });
  });
  var people = Object.keys(by).map(function(k){ return by[k]; })
    .sort(function(a, b){ return b.wins - a.wins || (b.wins / b.games) - (a.wins / a.games); });

  app.appendChild(el('<h1 class="headline num">' + list.length + ' <em>' +
    (list.length === 1 ? 'Partie' : 'Partien') + ' festgehalten</em></h1>'));
  app.appendChild(el('<p class="meta">' + (filter === "all" ? "\u00dcber alle Spiele" : gameInfo(filter).name) +
    ', sortiert nach Siegen.</p>'));

  people.forEach(function(p, i){
    var quote = Math.round(100 * p.wins / p.games);
    var row = el('<button class="rank tap' + (i === 0 ? ' first' : '') + '" type="button" style="--acc:' + hue(i) + '">' +
      '<span class="pos num">' + (i+1) + '</span>' +
      '<span class="nm">' + esc(p.name) + '<span class="sub">' + p.wins + ' von ' + p.games +
      ' gewonnen' + (filter === "all" ? '' : ', bester Wert ' + p.best) + '</span></span>' +
      '<span class="pt num">' + quote + '%</span></button>');
    bindTap(row, function(){
      playerSheet(p.name, people.filter(function(o){ return o !== p; }).map(function(o){ return o.name; }));
    });
    app.appendChild(row);
  });
  app.appendChild(el('<p class="hintline">Namen antippen, um doppelte Spieler zusammenzuf\u00fchren.</p>'));

  // ----- Kopf an Kopf -----
  var fokusKey = ALL.focus;
  var fokus = null;
  people.forEach(function(pp){ if (pp.key === fokusKey) fokus = pp; });
  if (!fokus) fokus = people[0];

  if (people.length > 1) {
    app.appendChild(el('<p class="group">Kopf an Kopf</p>'));
    var wahl = el('<div class="players"></div>');
    people.forEach(function(pp){
      var b = el('<button type="button" aria-current="' + (pp === fokus) + '" style="--acc:' +
        hue(people.indexOf(pp)) + '"><i></i>' + esc(pp.name) + '</button>');
      b.onclick = function(){ ALL.focus = pp.key; save(); render(); };
      wahl.appendChild(b);
    });
    app.appendChild(wahl);

    // Form: die letzten fuenf Partien
    var eigene = list.filter(function(h){ return platzVon(h, fokus.key) >= 0; });
    var letzte = eigene.slice(-5);
    var punkte = letzte.map(function(h){
      return '<i class="' + (platzVon(h, fokus.key) === 0 ? "win" : "loss") + '"></i>';
    }).join("");
    var siege5 = letzte.filter(function(h){ return platzVon(h, fokus.key) === 0; }).length;
    app.appendChild(el('<div class="line"><span>Form<span class="sub2">letzte ' + letzte.length +
      ' Partien</span></span><span class="v"><span class="form">' + punkte + '</span> ' +
      siege5 + '</span></div>'));

    // laengste Siegesserie
    var serie = 0, best = 0;
    eigene.forEach(function(h){
      if (platzVon(h, fokus.key) === 0) { serie++; if (serie > best) best = serie; } else serie = 0;
    });
    app.appendChild(el('<div class="line calc"><span>L\u00e4ngste Siegesserie</span>' +
      '<span class="v num">' + best + '</span></div>'));

    // Bilanz gegen jeden anderen
    people.forEach(function(gegner){
      if (gegner === fokus) return;
      var vor = 0, zurueck = 0;
      list.forEach(function(h){
        var a = platzVon(h, fokus.key), b = platzVon(h, gegner.key);
        if (a < 0 || b < 0) return;
        if (a < b) vor++; else if (b < a) zurueck++;
      });
      if (!vor && !zurueck) return;
      app.appendChild(el('<div class="line"><span>gegen ' + esc(gegner.name) + '</span>' +
        '<span class="v num' + (vor > zurueck ? " gut" : vor < zurueck ? " schlecht" : "") + '">' +
        vor + " zu " + zurueck + '</span></div>'));
    });
  }

  app.appendChild(el('<p class="group">Letzte Partien</p>'));
  list.slice().reverse().slice(0, 12).forEach(function(h){
    var dt = h.date.slice(8,10) + "." + h.date.slice(5,7) + "." + h.date.slice(2,4);
    app.appendChild(el('<div class="line calc"><span>' + dt + ', ' + gameInfo(h.game).name + '</span>' +
      '<span class="v num">' + esc(h.rows[0].name) + ' ' + h.rows[0].pts + '</span></div>'));
  });

  app.appendChild(groupBox());

  var clear = el('<button class="cta ghost" type="button">Verlauf l\u00f6schen</button>');
  clear.onclick = function(){
    if (confirm("Alle festgehaltenen Partien l\u00f6schen?")) { ALL.history = []; save(); render(); }
  };
  app.appendChild(clear);
}

function checkUpdate(){
  if (!window.fetch) return;
  fetch(location.pathname + "?probe=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.text() : null; })
    .then(function(html){
      if (!html) return;
      var m = html.match(/var VERSION = "([^"]+)"/);
      if (m && m[1] !== VERSION) zeigeUpdate(m[1]);
    })
    .catch(function(){});
